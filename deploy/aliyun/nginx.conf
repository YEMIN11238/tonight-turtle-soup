server {
  listen 80;
  server_name 47.114.42.94;
  server_tokens off;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 301 https://47.114.42.94$request_uri; }
}
server {
  listen 443 ssl;
  server_name 47.114.42.94;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/tonight-soup-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tonight-soup-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SOUP:1m;
  client_max_body_size 128k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 100s;
  }
}
